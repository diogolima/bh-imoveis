name: Publicar mapa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # base de endereços do IBGE (193 MB), baixada uma vez e reaproveitada
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cnefe-bh-2022
      - name: Gerar data.js a partir dos CSVs
        run: python3 build_data.py
      - name: Montar site
        run: mkdir _site && cp index.html data.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
